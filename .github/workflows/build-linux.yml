name: Build Linux AppImage

on:
  push:
    branches: [main, app-v0.1]
  workflow_dispatch:

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare FFmpeg and FFprobe
        run: |
          mkdir -p "$HOME/bin" "$HOME/bin/lib" "$RUNNER_TEMP/ffmpeg"
          curl -L --fail --retry 3 \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-07-12-47/ffmpeg-n9.0.2-48-gd4070a14ce-linux64-lgpl-shared-9.0.tar.xz" \
            -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg"
          find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg -exec install -m 755 {} "$HOME/bin/ffmpeg" \;
          find "$RUNNER_TEMP/ffmpeg" -type f -name ffprobe -exec install -m 755 {} "$HOME/bin/ffprobe" \;
          find "$RUNNER_TEMP/ffmpeg" -name '*.so*' -exec cp -a {} "$HOME/bin/lib/" \;
          LD_LIBRARY_PATH="$HOME/bin/lib" "$HOME/bin/ffmpeg" -version
          LD_LIBRARY_PATH="$HOME/bin/lib" "$HOME/bin/ffprobe" -version

      - name: Install frontend dependencies
        run: npm install

      - name: Build Blaze AppImage
        run: npm run tauri -- build --bundles appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Blaze-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
