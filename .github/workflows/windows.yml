name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "native-app/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 ZIP
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve and verify Cargo dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # The Windows-only winres build dependency was added after the
          # committed lockfile was generated. Resolve the workspace first so
          # Cargo can update Cargo.lock, then require all subsequent build
          # steps to use that resolved lockfile without further changes.
          cargo metadata --format-version 1 --no-deps | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo metadata validation failed."
          }

          cargo metadata --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo could not resolve the workspace dependencies."
          }

          cargo metadata --locked --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo.lock was not stable after dependency resolution."
          }

      - name: Download LGPL MPV runtime and development package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod -Headers @{ "User-Agent" = "Blaze-Windows-CI" } -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-lgpl-x86_64-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "No x86_64 LGPL MPV development archive was found." }

          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev-lgpl.7z"
          $extract = Join-Path $env:RUNNER_TEMP "mpv-dev-lgpl"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive

          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { choco install 7zip --yes --no-progress }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip was not found." }
          & $sevenZip x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the MPV archive." }

          $mpvDll = Get-ChildItem -Path $extract -Filter "libmpv-2.dll" -File -Recurse | Select-Object -First 1
          if (-not $mpvDll) { throw "The MPV archive did not contain libmpv-2.dll." }

          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhereCommand = Get-Command "vswhere.exe" -ErrorAction SilentlyContinue
            if ($vswhereCommand) { $vswhere = $vswhereCommand.Source }
          }
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }
          $vsRoot = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($vsRoot | Select-Object -First 1))) {
            throw "Could not find the Visual Studio x64 MSVC C++ tools."
          }
          $vsRoot = ($vsRoot | Select-Object -First 1).Trim()
          $msvcRoot = Join-Path $vsRoot "VC\Tools\MSVC"
          $msvcToolDir = Get-ChildItem -Path $msvcRoot -Directory | Sort-Object Name -Descending | ForEach-Object {
            $candidate = Join-Path $_.FullName "bin\Hostx64\x64"
            if ((Test-Path (Join-Path $candidate "lib.exe")) -and (Test-Path (Join-Path $candidate "dumpbin.exe"))) { $candidate }
          } | Select-Object -First 1
          if (-not $msvcToolDir) { throw "Could not locate both lib.exe and dumpbin.exe." }

          $dumpbinOutput = & (Join-Path $msvcToolDir "dumpbin.exe") /nologo /exports $mpvDll.FullName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed to inspect libmpv-2.dll." }
          $exports = @($dumpbinOutput | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') { $Matches[1] }
          } | Sort-Object -Unique)
          if ($exports.Count -eq 0) { throw "No named exports found in libmpv-2.dll." }

          $definitionFile = Join-Path $mpvDll.Directory.FullName "libmpv-2.def"
          @("LIBRARY libmpv-2.dll", "EXPORTS") + $exports | Set-Content -Path $definitionFile -Encoding ascii
          $importLibrary = Join-Path $mpvDll.Directory.FullName "mpv.lib"
          $libOutput = & (Join-Path $msvcToolDir "lib.exe") "/nologo" "/def:$definitionFile" "/name:libmpv-2.dll" "/out:$importLibrary" "/MACHINE:X64" 2>&1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $importLibrary)) {
            throw "MSVC lib.exe could not generate mpv.lib: $($libOutput -join [Environment]::NewLine)"
          }

          "MPV_LIBRARY_DIR=$($mpvDll.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MPV runtime directory: $($mpvDll.Directory.FullName)"

      - name: Download LGPL FFmpeg shared build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-win64-lgpl.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-win64-lgpl"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $ffmpeg = Get-ChildItem -Path $extract -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Filter "ffprobe.exe" -File -Recurse | Select-Object -First 1
          $license = Get-ChildItem -Path $extract -Filter "LICENSE.txt" -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe -or -not $license) {
            throw "FFmpeg shared archive is missing ffmpeg.exe, ffprobe.exe, or LICENSE.txt."
          }
          $ffmpegDlls = @(Get-ChildItem -Path $ffmpeg.Directory.FullName -Filter "*.dll" -File)
          if ($ffmpegDlls.Count -eq 0) {
            throw "The selected FFmpeg archive is not a shared build: no runtime DLLs were found beside ffmpeg.exe."
          }
          "FFMPEG_BIN_DIR=$($ffmpeg.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FFMPEG_LICENSE_FILE=$($license.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { throw "Downloaded FFmpeg failed its version check." }
          & $ffprobe.FullName -version
          if ($LASTEXITCODE -ne 0) { throw "Downloaded FFprobe failed its version check." }

      - name: Build Blaze
        run: cargo build --release --locked -p blaze-native

      - name: Assemble and validate Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\Blaze"
          $bin = Join-Path $stage "Bin"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Copy-Item "target\release\blaze-native.exe" (Join-Path $stage "Blaze.exe")
          if (-not (Test-Path (Join-Path $stage "Blaze.exe"))) { throw "Blaze.exe was not produced." }

          # Keep each tool beside its runtime DLLs so Windows can resolve imports.
          Get-ChildItem -Path $env:MPV_LIBRARY_DIR -Filter "*.dll" -File | Copy-Item -Destination $bin -Force
          if (-not (Test-Path (Join-Path $bin "libmpv-2.dll"))) { throw "Bin is missing libmpv-2.dll." }

          Copy-Item (Join-Path $env:FFMPEG_BIN_DIR "ffmpeg.exe") (Join-Path $bin "ffmpeg.exe")
          Copy-Item (Join-Path $env:FFMPEG_BIN_DIR "ffprobe.exe") (Join-Path $bin "ffprobe.exe")
          $ffmpegDlls = @(Get-ChildItem -Path $env:FFMPEG_BIN_DIR -Filter "*.dll" -File)
          if ($ffmpegDlls.Count -eq 0) { throw "No FFmpeg shared runtime DLLs were found." }
          $ffmpegDlls | Copy-Item -Destination $bin -Force
          Copy-Item $env:FFMPEG_LICENSE_FILE (Join-Path $bin "FFmpeg-LICENSE.txt")

          @"
          Blaze for Windows x64

          Extract the Blaze folder and run Blaze.exe.
          Keep the Bin folder intact. It contains the MPV runtime DLLs and the
          FFmpeg/FFprobe executables used for media analysis, playback preparation,
          and exports. The Blaze logo is embedded in Blaze.exe.

          FFmpeg is an LGPL shared build from BtbN/FFmpeg-Builds.
          Its runtime DLLs are included in Bin alongside ffmpeg.exe and ffprobe.exe.
          See Bin\FFmpeg-LICENSE.txt for the included license notice.
          Build source: https://github.com/BtbN/FFmpeg-Builds
          "@ | Set-Content -Path (Join-Path $stage "Readme.txt") -Encoding utf8

          $required = @(
            (Join-Path $stage "Blaze.exe"),
            (Join-Path $stage "Readme.txt"),
            (Join-Path $bin "FFmpeg-LICENSE.txt"),
            (Join-Path $bin "libmpv-2.dll"),
            (Join-Path $bin "ffmpeg.exe"),
            (Join-Path $bin "ffprobe.exe")
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required release file is missing: $file" }
            if ((Get-Item $file).Length -eq 0) { throw "Release file is empty: $file" }
          }
          if (@(Get-ChildItem -Path $bin -Filter "*.dll" -File).Count -lt 1) { throw "MPV runtime DLLs were not staged." }

          & (Join-Path $bin "ffmpeg.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Staged FFmpeg failed its version check." }
          & (Join-Path $bin "ffprobe.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Staged FFprobe failed its version check." }

          # Exercise Blaze's real FFmpeg integration against the staged shared build:
          # generate a sample, probe metadata, detect keyframes, decode waveform/audio,
          # and stream MJPEG preview frames. This catches missing runtime DLLs and
          # incompatible FFmpeg functionality beyond a simple -version check.
          $env:PATH = "$bin;$env:PATH"
          cargo test --locked -p blaze-engine --test ffmpeg_integration -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Blaze FFmpeg integration tests failed with the staged shared build." }

          $totalBytes = (Get-ChildItem -Path $stage -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $totalMiB = [Math]::Round($totalBytes / 1MB, 2)
          Write-Host "Extracted Blaze release size: $totalMiB MiB"
          Write-Host "Windows release directory staged for artifact upload."
          Get-ChildItem $stage -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Blaze-V1-Windows
          path: dist/Blaze/
          if-no-files-found: error
          retention-days: 14
