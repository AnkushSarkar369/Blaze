[package]
name = "blaze-native"
version = "0.1.0"
edition = "2021"
description = "Native desktop application shell for Blaze."

# Kept as an isolated workspace while the native migration is validated.
# It will be folded into the root workspace once the application foundation is stable.
[workspace]

[dependencies]
blaze-engine = { path = "../crates/blaze-engine" }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
egui_glow = "=0.37.0"
glow = "=0.17.0"
rsmpv = { version = "=0.2.1", features = ["render"] }
