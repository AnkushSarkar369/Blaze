[package]
name = "blaze-engine"
version = "1.0.0"
description = "UI-independent FFmpeg media engine for Blaze."
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
